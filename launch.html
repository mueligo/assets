<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Launcher...</title>
  <style>
    body {
      background: #0f1117;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1a1d26;
      border: 1px solid #2a2e3d;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #ffffff;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #9ba1b0;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #5865f2;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4752c4;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #5865f2;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .subtext {
      margin-top: 16px;
      font-size: 12px;
      color: #6c7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 id="title">Opening Launcher...</h2>
    <p id="desc">Directing to official desktop application on your device.</p>
    <a id="launch-btn" class="btn" href="#">Open Manually</a>
    <div class="subtext">You may close this tab after the app launches.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUri = params.get('uri') || params.get('url');
    if (targetUri) {
      let appName = "Game Launcher";
      if (targetUri.startsWith("steam:")) appName = "Steam";
      else if (targetUri.startsWith("com.epicgames")) appName = "Epic Games Launcher";
      else if (targetUri.startsWith("goggalaxy:")) appName = "GOG Galaxy";
      else if (targetUri.startsWith("itchio:")) appName = "itch.io";
      else if (targetUri.startsWith("uplay:")) appName = "Ubisoft Connect";
      else if (targetUri.startsWith("origin2:")) appName = "EA App";
      else if (targetUri.startsWith("battlenet:")) appName = "Battle.net";
      else if (targetUri.startsWith("ms-windows-store:")) appName = "Microsoft Store";

      document.title = `Opening ${appName}...`;
      document.getElementById('title').textContent = `Opening ${appName}...`;
      document.getElementById('desc').textContent = `Redirecting directly to the ${appName} desktop client.`;
      const btn = document.getElementById('launch-btn');
      btn.textContent = `Open ${appName} Manually`;
      btn.href = targetUri;

      setTimeout(() => {
        window.location.href = targetUri;
      }, 100);
    }
  </script>
</body>
</html>
